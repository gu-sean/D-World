# 개발 전용: 아래 계정·비밀번호는 로컬 개발용 값이며 운영에서 쓰지 않는다
name: dworld

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dworld
      POSTGRES_PASSWORD: dworld
      POSTGRES_DB: d_world
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dworld -d d_world"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
